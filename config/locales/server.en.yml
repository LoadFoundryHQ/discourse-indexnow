en:
  site_settings:
    indexnow_enabled: "Enable Load Foundry IndexNow: notify IndexNow search engines (Bing, Yandex, Seznam, Naver) when your topics change."
    indexnow_key: "Your IndexNow key. It is served publicly at /<key>.txt so engines can verify ownership. Leave it empty to auto-generate one."
    indexnow_endpoint: "IndexNow API endpoint. Default: https://api.indexnow.org/indexnow"
    indexnow_submit_on_create: "Submit a topic URL when a new topic is created."
    indexnow_submit_on_update: "Submit a topic URL when a post is edited or a topic is deleted."
    indexnow_submit_on_reply: "Submit the topic URL when a new reply is posted."
    indexnow_excluded_category_ids: "Category IDs to exclude from submissions."
    indexnow_excluded_tag_names: "Tag names to exclude from submissions."
    indexnow_hourly_limit: "Maximum URLs to submit per hour (0 = no limit). Over-quota batches are retried automatically."
    indexnow_daily_limit: "Maximum URLs to submit per day."
